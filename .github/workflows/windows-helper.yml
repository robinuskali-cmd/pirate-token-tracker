name: Test Windows hotkey companion
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/windows-helper.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: pwsh
        run: |
          ./desktop/build.ps1
          $testReport = Join-Path $env:RUNNER_TEMP 'hotkeys-tests.txt'
          $testProcess = Start-Process -FilePath ./downloads/Pirate-Token-Hotkeys.exe -ArgumentList @('--self-test', ('"' + $testReport + '"')) -WindowStyle Hidden -PassThru -Wait
          Get-Content -LiteralPath $testReport
          if ($testProcess.ExitCode -ne 0) { throw 'Hotkey tests failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Pirate-Token-Hotkeys-Windows
          path: downloads/Pirate-Token-Hotkeys.exe
